# Values for kube-prometheus-stack Helm chart
# Install: helm install monitoring prometheus-community/kube-prometheus-stack -f monitoring/prometheus/kube-prometheus-values.yml

prometheus:
  prometheusSpec:
    # Scrape interval for metrics
    scrapeInterval: "15s"
    evaluationInterval: "15s"
    # Retain metrics for 7 days
    retention: 7d
    # Resource limits for Minikube
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    # Pick up all ServiceMonitors regardless of labels
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

grafana:
  enabled: true
  adminUser: admin
  adminPassword: securemlops
  service:
    type: NodePort
    nodePort: 31000
  # Auto-provision dashboards from ConfigMaps with this label
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  # Default Prometheus datasource
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://monitoring-kube-prometheus-prometheus:9090
          access: proxy
          isDefault: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

# Pushgateway for batch jobs (drift detection CronJob)
prometheus-pushgateway:
  enabled: true
  serviceMonitor:
    enabled: true

# Node exporter for system metrics
nodeExporter:
  enabled: true

# Kube-state-metrics for K8s object metrics
kubeStateMetrics:
  enabled: true
