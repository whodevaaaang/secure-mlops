replicaCount: 2

image:
  repository: secure-mlops-api
  tag: v1
  pullPolicy: Never

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

health:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 30
  readiness:
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 10

env:
  MODEL_PATH: "/app/model/artifacts/model.joblib"
  SCHEMA_PATH: "/app/model/artifacts/schema.json"
  METRICS_PATH: "/app/model/artifacts/metrics.json"

metrics:
  enabled: true
  port: 8000
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 15s

drift:
  enabled: true
  schedule: "0 */6 * * *"  # Every 6 hours
  image:
    repository: securemlops-drift-detector
    tag: v1
    pullPolicy: Never
  pushgateway:
    enabled: true
    url: "http://monitoring-kube-prometheus-pushgateway:9091"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  storage:
    predictions: "1Gi"
    reports: "1Gi"

rollback:
  revisionHistoryLimit: 5
  maxSurge: 1
  maxUnavailable: 0
  minReadySeconds: 30

blueGreen:
  enabled: false
  activeSlot: blue            # "blue" or "green" — the slot serving live traffic
  previewNodePort: 30081      # NodePort for testing the inactive slot
  blue:
    replicas: 2
    image:
      repository: secure-mlops-api
      tag: v1
  green:
    replicas: 2
    image:
      repository: secure-mlops-api
      tag: v2

secrets:
  enabled: false
  data:
    MLFLOW_TRACKING_URI: "http://mlflow:5000"
    GRAFANA_ADMIN_PASSWORD: ""
    DB_CONNECTION_STRING: ""

networkPolicy:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPU: 70               # Scale up when avg CPU exceeds 70%
  targetMemory: 80             # Scale up when avg memory exceeds 80%
  scaleUpStabilization: 30     # Wait 30s before scaling up
  scaleDownStabilization: 300  # Wait 5min before scaling down
  customMetrics:
    enabled: false
    targetRequestRate: "50"    # Target requests/sec per pod

canary:
  enabled: false
  replicas: 1                   # Canary pod count (controls traffic %)
  nodePort: 30082               # NodePort for canary-only testing
  image:
    repository: secure-mlops-api
    tag: v2                     # New version under test
  stable:
    replicas: 2                 # Stable pod count
    image:
      repository: secure-mlops-api
      tag: v1                   # Current production version
  analysis:
    errorThreshold: 0.05        # Max 5xx rate before auto-rollback
    latencyThreshold: 500       # Max p95 latency (ms) before rollback
    checkInterval: 30           # Seconds between analysis checks
    checkCount: 10              # Number of checks before promotion

security:
  trivy:
    enabled: true
    image:
      repository: aquasec/trivy
      tag: latest
    severity: "CRITICAL,HIGH"
    exitCode: 1
    timeout: "5m0s"
    dockerSocket: false
    pushgateway:
      enabled: true
      url: "http://monitoring-kube-prometheus-pushgateway:9091"
  opa:
    enabled: true
