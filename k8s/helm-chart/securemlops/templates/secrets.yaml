{{- if .Values.secrets.enabled }}
---
# Kubernetes Secret for sensitive configuration.
# In production, this should be replaced with a SealedSecret (see sealed-secret.yaml).
# This template is for local/dev environments only.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}-api
    project: secure-mlops
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
