{{- if .Values.security.trivy.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-trivy-scan
  labels:
    app: {{ .Release.Name }}
    component: security
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-trivy-scan
    spec:
      restartPolicy: Never
      containers:
        - name: trivy-scan
          image: {{ .Values.security.trivy.image.repository }}:{{ .Values.security.trivy.image.tag }}
          command:
            - trivy
            - image
            - --severity
            - {{ .Values.security.trivy.severity | default "CRITICAL,HIGH" }}
            - --exit-code
            - "{{ .Values.security.trivy.exitCode | default 1 }}"
            - --ignore-unfixed
            - --timeout
            - {{ .Values.security.trivy.timeout | default "5m0s" }}
            - --format
            - table
            - {{ .Values.image.repository }}:{{ .Values.image.tag }}
          {{- if .Values.security.trivy.pushgateway.enabled }}
          env:
            - name: PUSHGATEWAY_URL
              value: {{ .Values.security.trivy.pushgateway.url }}
          {{- end }}
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
      {{- if .Values.security.trivy.dockerSocket }}
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
      {{- end }}
{{- end }}
